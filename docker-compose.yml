services:
  coding-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coding-ai

    environment:
      SERVICE_NAME: coding-ai
      VERSION: 1.0.0
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      PORT: 8690
      # DEFAULT_TENANT_ID intentionally unset. It used to be "n8n-dev", the
      # stale pre-uuid7 label of a real tenant — writing under it lands in a
      # silo no live JWT can address. It is only consulted by the TRUSTED_CIDRS
      # bypass, which is empty by default, so leaving it unset costs nothing.
      # Set it (to a uuid7 tenant id) only alongside a deliberate TRUSTED_CIDRS.
      ENABLE_AUTH: "true"
      # X-Tenant-Id is an unverified claim from any in-mesh caller. Default
      # "true" preserves today's behaviour; set "false" once this service is
      # known to be reached only via the gateway or with a license token.
      TRUST_TENANT_HEADER: "true"
      ENABLE_DOCS: "true"

      # Comma-separated browser origins. "*" keeps cross-origin reads anonymous
      # (credentials are switched off automatically for a wildcard); set an
      # explicit list to enable credentialed CORS. See .env.example.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}

      # Database
      DATABASE_URL: postgresql+psycopg://coding:${POSTGRES_PASSWORD:-coding}@postgres:5432/code_graph
      PGBOUNCER_URL: postgresql+psycopg://coding:${POSTGRES_PASSWORD:-coding}@pgbouncer:6432/code_graph

      # Redis
      REDIS_URL: redis://code-graph-redis:6379/0

      # OpenTelemetry
      OTLP_TRACES_ENDPOINT: http://grafana-agent:4318/v1/traces
      OTEL_SERVICE_NAME: coding-ai
      OTEL_SDK_DISABLED: "false"

    ports:
      - "0.0.0.0:8690:8690"

    networks:
      - workflow-system-network

    restart: unless-stopped


    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8690/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  workflow-system-network:
    driver: bridge
